<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La caja del tesoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7EC;--ink:#33244F;--ink-soft:#6B5C86;
    --rosa:#FF5C8A;--amarillo:#FFC542;--turquesa:#1FBFA4;--violeta:#8257D6;--coral:#FF8A5B;
    --display:'Fredoka','Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;
    --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--body);color:var(--ink);
    background:radial-gradient(1200px 500px at 50% -200px,#FFE9C7 0%,transparent 70%),var(--cream);
    min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

  .papel{width:100%;height:64px;display:block}
  .papel .flag{transform-origin:top center;animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}

  .wrap{max-width:620px;margin:0 auto;padding:8px 18px 60px;text-align:center}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:.72rem;color:var(--rosa);display:inline-block;background:#fff;border:2px solid #FFDCE6;
    padding:5px 14px;border-radius:999px;box-shadow:0 4px 0 rgba(255,92,138,.18)}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,8vw,3rem);line-height:1.05;
    margin:.5rem 0 .2rem;letter-spacing:-.01em}
  .lead{font-size:1.1rem;color:var(--ink-soft);max-width:26ch;margin:.4rem auto 0;font-weight:700}

  /* ---- grid de cajas ---- */
  .boxes{display:grid;gap:20px;margin-top:30px}
  @media(min-width:520px){.boxes{grid-template-columns:repeat(3,1fr)}}
  .pick{
    position:relative;border:none;cursor:pointer;background:#fff;border-radius:26px;
    padding:26px 16px 18px;box-shadow:0 10px 0 rgba(51,36,79,.12),0 18px 30px rgba(51,36,79,.14);
    font-family:var(--display);transition:transform .16s ease;color:var(--ink);
  }
  .pick:hover{transform:translateY(-4px)}
  .pick:active{transform:translateY(2px)}
  .pick:focus-visible{outline:3px solid var(--violeta);outline-offset:3px}
  .pick .mini{height:120px;display:grid;place-items:center;margin-bottom:6px}
  .pick .lbl{font-weight:600;font-size:1.2rem}
  .pick .mini .gbox{animation:bob 2.4s ease-in-out infinite}
  .pick:nth-child(2) .mini .gbox{animation-delay:.3s}
  .pick:nth-child(3) .mini .gbox{animation-delay:.6s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  /* ---- caja de regalo (reutilizable) ---- */
  .gbox{position:relative;width:130px;height:112px}
  .gbox.small{transform:scale(.82)}
  .gbox .base{position:absolute;bottom:0;left:13px;width:104px;height:80px;border-radius:9px;
    background:linear-gradient(180deg,var(--bx-light),var(--bx));box-shadow:inset 0 -9px 0 rgba(0,0,0,.1)}
  .gbox .vrib{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:22px;height:80px;background:var(--rb)}
  .gbox .lid{position:absolute;top:18px;left:0;width:130px;height:35px;border-radius:8px;
    background:linear-gradient(180deg,var(--bx),var(--bx-dark));box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);
    transition:transform .5s cubic-bezier(.3,-.4,.4,1.4),opacity .4s}
  .gbox .lid .lrib{position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:35px;background:var(--rb)}
  .gbox .bow{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:46px;height:23px;
    transition:transform .5s cubic-bezier(.3,-.4,.4,1.4),opacity .4s}
  .gbox .bow::before,.gbox .bow::after{content:"";position:absolute;top:0;width:23px;height:23px;
    border-radius:50% 50% 50% 0;background:var(--rb);box-shadow:inset -3px -3px 0 rgba(0,0,0,.08)}
  .gbox .bow::before{left:0;transform:rotate(-20deg)}
  .gbox .bow::after{right:0;transform:rotate(20deg) scaleX(-1)}
  .gbox.shake{animation:shake .5s ease-in-out}
  @keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-5px) rotate(-5deg)}40%{transform:translateX(5px) rotate(5deg)}60%{transform:translateX(-4px) rotate(-4deg)}80%{transform:translateX(4px) rotate(4deg)}}
  .gbox.open .lid{transform:translateY(-110px) rotate(-14deg);opacity:0}
  .gbox.open .bow{transform:translateX(-50%) translateY(-140px) rotate(30deg);opacity:0}

  /* colores */
  .box-azul{--bx:#3B82F6;--bx-light:#5C9BFF;--bx-dark:#2563EB;--rb:#FFD84D}
  .box-roja{--bx:#EF4444;--bx-light:#FF6B6B;--bx-dark:#DC2626;--rb:#FFD84D}
  .box-dorada{--bx:#F5B301;--bx-light:#FFD34D;--bx-dark:#D99400;--rb:#FFFDF5}

  .lbl-azul{color:#2563EB}.lbl-roja{color:#DC2626}.lbl-dorada{color:#C98A00}

  /* ---- modal ---- */
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    padding:20px;background:rgba(51,36,79,.55);backdrop-filter:blur(4px)}
  .modal.open{display:flex}
  .sheet{position:relative;width:min(440px,94vw);background:var(--cream);border-radius:30px;
    padding:30px 26px 28px;text-align:center;box-shadow:0 24px 60px rgba(51,36,79,.4);
    animation:pop .35s cubic-bezier(.2,.9,.3,1.5)}
  @keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
  .close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:none;
    background:#fff;color:var(--ink);font-size:1.3rem;cursor:pointer;box-shadow:0 3px 0 rgba(51,36,79,.15);line-height:1}
  .close:hover{background:var(--rosa);color:#fff}

  .box-stage{height:150px;display:grid;place-items:center;margin:6px auto 4px}
  .msg{display:none}
  .msg.show{display:block;animation:rise .45s ease both}
  @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .msg .big{font-family:var(--display);font-weight:700;line-height:1.1;margin:2px 0}
  .msg.wrong .big{font-size:clamp(1.9rem,8vw,2.4rem);color:var(--ink)}
  .msg.wrong .sub{font-family:var(--display);font-weight:500;color:var(--ink-soft);font-size:1.1rem;margin-top:4px}
  .msg.right .to{font-family:var(--display);font-weight:600;color:var(--ink-soft);font-size:1.15rem}
  .msg.right .key{font-family:var(--display);font-weight:700;letter-spacing:.02em;
    font-size:clamp(2.4rem,13vw,3.6rem);margin:4px 0;text-transform:uppercase;
    background:linear-gradient(90deg,#E8A200,#FFCE3A,#FF8A5B);-webkit-background-clip:text;background-clip:text;color:transparent}
  .msg .emoji{font-size:1.9rem;margin-top:2px}
  .btn{margin-top:20px;font-family:var(--display);font-weight:600;font-size:1.1rem;border:none;
    border-radius:999px;padding:15px 30px;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,#9B6BE8,var(--violeta));box-shadow:0 6px 0 #5E3EA6;transition:transform .12s}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #5E3EA6}

  canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
  canvas.confetti.on{display:block}

  @media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.15s!important}.papel .flag,.pick .mini .gbox{animation:none}}
</style>
</head>
<body>

<svg class="papel" viewBox="0 0 720 64" preserveAspectRatio="none" aria-hidden="true" id="papel"></svg>

<div class="wrap">
  <span class="eyebrow">Detectives · La pista secreta</span>
  <h1>🔍 ¿Dónde está la pista?</h1>
  <p class="lead">Tocá una caja para abrirla. ¡Una esconde la palabra clave!</p>

  <div class="boxes" id="boxes">
    <button class="pick" data-color="azul" data-result="wrong" aria-label="Abrir la caja azul">
      <div class="mini"><div class="gbox small box-azul"><div class="bow"></div><div class="lid"><div class="lrib"></div></div><div class="base"><div class="vrib"></div></div></div></div>
      <div class="lbl lbl-azul">Caja azul</div>
    </button>
    <button class="pick" data-color="roja" data-result="wrong" aria-label="Abrir la caja roja">
      <div class="mini"><div class="gbox small box-roja"><div class="bow"></div><div class="lid"><div class="lrib"></div></div><div class="base"><div class="vrib"></div></div></div></div>
      <div class="lbl lbl-roja">Caja roja</div>
    </button>
    <button class="pick" data-color="dorada" data-result="right" aria-label="Abrir la caja dorada">
      <div class="mini"><div class="gbox small box-dorada"><div class="bow"></div><div class="lid"><div class="lrib"></div></div><div class="base"><div class="vrib"></div></div></div></div>
      <div class="lbl lbl-dorada">Caja dorada</div>
    </button>
  </div>
</div>

<!-- modal -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <button class="close" id="closeBtn" aria-label="Cerrar">✕</button>
    <div class="box-stage">
      <div class="gbox" id="modalBox"><div class="bow"></div><div class="lid"><div class="lrib"></div></div><div class="base"><div class="vrib"></div></div></div>
    </div>

    <div class="msg wrong" id="msgWrong">
      <div class="big">¡Sigan intentando! 🔎</div>
      <div class="sub">Probá con otra caja</div>
      <button class="btn" id="wrongBtn">↺ Volver</button>
    </div>

    <div class="msg right" id="msgRight">
      <div class="to">¡Acertaron! 🎉 La palabra clave es:</div>
      <div class="key">Lavarropa</div>
      <div class="emoji">🧺✨🎈</div>
      <button class="btn" id="rightBtn">¡Genial!</button>
    </div>
  </div>
</div>

<canvas class="confetti" id="confetti"></canvas>

<script>
(function(){
  "use strict";
  const PALETTE=["#FF5C8A","#FFC542","#1FBFA4","#8257D6","#FF8A5B"];
  const CONFETTI=["#F5B301","#FFD34D","#FF8A5B","#1FBFA4","#8257D6","#57C7FF"];
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* papel picado */
  (function(){const svg=document.getElementById("papel");const n=12,w=720/n;
    let s='<line x1="0" y1="6" x2="720" y2="6" stroke="#C9B79B" stroke-width="2"/>';
    for(let i=0;i<n;i++){const x=i*w,c=PALETTE[i%PALETTE.length];
      s+='<g class="flag" style="animation-delay:'+(i*.18)+'s">';
      s+='<path d="M'+x+' 6 L'+(x+w)+' 6 L'+(x+w)+' 34 L'+(x+w/2)+' 50 L'+x+' 34 Z" fill="'+c+'"/>';
      s+='<circle cx="'+(x+w/2)+'" cy="20" r="4.5" fill="#FFF7EC"/>';
      s+='<circle cx="'+(x+w*0.28)+'" cy="16" r="2.4" fill="#FFF7EC"/>';
      s+='<circle cx="'+(x+w*0.72)+'" cy="16" r="2.4" fill="#FFF7EC"/></g>';}
    svg.innerHTML=s;})();

  const modal=document.getElementById("modal");
  const modalBox=document.getElementById("modalBox");
  const msgWrong=document.getElementById("msgWrong");
  const msgRight=document.getElementById("msgRight");

  function openBox(color,result){
    modalBox.className="gbox box-"+color;
    msgWrong.classList.remove("show");
    msgRight.classList.remove("show");
    modal.classList.add("open");
    const reveal=()=>{
      modalBox.classList.add("open");
      if(result==="right"){ msgRight.classList.add("show"); burst(); }
      else{ msgWrong.classList.add("show"); }
    };
    if(reduce){ reveal(); }
    else{ modalBox.classList.add("shake"); setTimeout(()=>{modalBox.classList.remove("shake");reveal();},480); }
  }
  function closeModal(){ modal.classList.remove("open"); stopConfetti(); }

  document.querySelectorAll(".pick").forEach(b=>{
    b.addEventListener("click",()=>openBox(b.dataset.color,b.dataset.result));
  });
  document.getElementById("closeBtn").addEventListener("click",closeModal);
  document.getElementById("wrongBtn").addEventListener("click",closeModal);
  document.getElementById("rightBtn").addEventListener("click",closeModal);
  modal.addEventListener("click",e=>{if(e.target===modal)closeModal();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("open"))closeModal();});

  /* confetti */
  const canvas=document.getElementById("confetti");const ctx=canvas.getContext("2d");
  let parts=[],raf=null;
  function sizeC(){canvas.width=innerWidth;canvas.height=innerHeight;}
  addEventListener("resize",sizeC);sizeC();
  function burst(){
    if(reduce)return;sizeC();canvas.classList.add("on");
    const cx=innerWidth/2,cy=innerHeight*0.4;parts=[];
    for(let i=0;i<150;i++){const a=Math.random()*Math.PI*2,sp=4+Math.random()*9;
      parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,g:.22+Math.random()*.1,
        w:6+Math.random()*7,h:9+Math.random()*8,rot:Math.random()*6.28,vr:(Math.random()-.5)*.4,
        color:CONFETTI[i%CONFETTI.length],life:0,ttl:90+Math.random()*40});}
    if(raf)cancelAnimationFrame(raf);tick();
  }
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);let alive=false;
    for(const p of parts){p.life++;if(p.life>p.ttl)continue;alive=true;
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.vx*=.99;
      const fade=Math.max(0,1-(p.life/p.ttl));
      ctx.save();ctx.globalAlpha=fade;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}
    if(alive)raf=requestAnimationFrame(tick);else stopConfetti();
  }
  function stopConfetti(){if(raf)cancelAnimationFrame(raf);raf=null;ctx.clearRect(0,0,canvas.width,canvas.height);canvas.classList.remove("on");}
})();
</script>
</body>
</html>
